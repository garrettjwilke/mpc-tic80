name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$'; then
            echo "Tag must look like v1.2.3 or v1.2.3-beta" >&2
            exit 1
          fi

      - name: Stop if this release already exists
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Init TIC-80 submodules
        run: git -C TIC-80 submodule update --init

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Build
        run: make

      - name: Check the autorun zip
        run: |
          python3 - <<'PY'
          import os, sys, zipfile
          app = "mpc-tic80"
          path = "build/" + app + ".zip"
          want = [
              "autorun/autorun.json",
              "autorun/autorun.sh",
              "autorun/autorun.check",
              "autorun/" + app,
          ]
          with zipfile.ZipFile(path) as zipped:
              names = sorted(info.filename for info in zipped.infolist())
              blob = zipped.read("autorun/" + app)
          if names != sorted(want):
              sys.stderr.write("zip entries are %s\n" % ", ".join(names))
              sys.exit(1)
          out = "build/" + app + ".checked"
          with open(out, "wb") as fh:
              fh.write(blob)
          os.chmod(out, 0o755)
          PY
          file build/mpc-tic80.checked | grep -q aarch64

      - name: Publish the release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" build/mpc-tic80.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Autorun package. The zip contains an \`autorun/\` folder. Copy that folder to the card, or add the zip with mpc-boot-thingy."
